<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>multiagents dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #161b22;
      --surface2: #1c2333;
      --border: #2d333b;
      --text: #e6edf3;
      --text-dim: #a0a9b5;
      --text-muted: #929cab;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --orange: #db6d28;
      --red: #f85149;
      --purple: #bc8cff;
      --cyan: #39d2c0;
      --blue: #58a6ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
    }

    /* --- Header --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-title { font-weight: 600; font-size: 15px; }
    .header-session {
      font-size: 13px;
      color: var(--text-dim);
      background: var(--surface2);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .conn-dot {
      width: 8px; height: 8px; border-radius: 50%;
      display: inline-block;
    }
    .conn-dot.alive { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .conn-dot.dead { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .header-right { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-dim); }

    /* --- Tab Bar --- */
    .tabs {
      display: flex;
      overflow-x: auto;
      gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      flex-shrink: 0;
    }
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      color: var(--text-dim);
      border-bottom: 2px solid transparent;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .tab:hover { color: var(--text); background: var(--surface2); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-badge {
      font-size: 11px;
      padding: 0 6px;
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text-dim);
      min-width: 18px;
      text-align: center;
    }
    .tab.active .tab-badge { background: rgba(88,166,255,0.15); color: var(--accent); }

    /* --- Main layout --- */
    .main {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }

    /* --- Cards --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .card-header {
      padding: 10px 14px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* --- Agent Cards --- */
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    .agent-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      transition: border-color 0.2s;
    }
    .agent-card:hover { border-color: var(--accent); }
    .agent-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .agent-name { font-weight: 600; font-size: 14px; }
    .agent-role { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
    .agent-summary { font-size: 12px; color: var(--text-dim); line-height: 1.4; margin-top: 8px;
      border-top: 1px solid var(--border); padding-top: 8px; }

    /* --- Status badges --- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-idle { background: rgba(125,133,144,0.15); color: var(--text-dim); }
    .badge-working { background: rgba(88,166,255,0.15); color: var(--blue); }
    .badge-review { background: rgba(210,153,34,0.15); color: var(--yellow); }
    .badge-feedback { background: rgba(219,109,40,0.15); color: var(--orange); }
    .badge-approved { background: rgba(63,185,80,0.15); color: var(--green); }
    .badge-released { background: rgba(125,133,144,0.1); color: var(--text-muted); }
    .badge-connected { background: rgba(63,185,80,0.15); color: var(--green); }
    .badge-disconnected { background: rgba(248,81,73,0.15); color: var(--red); }

    /* --- Message feed --- */
    .msg-feed { max-height: calc(100vh - 160px); overflow-y: auto; }
    .msg-item {
      display: flex;
      gap: 10px;
      padding: 6px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      transition: background 0.15s;
    }
    .msg-item:hover { background: var(--surface2); }
    .msg-time { color: var(--text-muted); font-size: 12px; white-space: nowrap; font-family: monospace; min-width: 60px; }
    .msg-from { color: var(--accent); font-weight: 500; white-space: nowrap; min-width: 100px; }
    .msg-type {
      font-size: 10px; padding: 1px 6px; border-radius: 4px;
      text-transform: uppercase; font-weight: 600; white-space: nowrap;
    }
    .msg-type-chat { background: rgba(88,166,255,0.15); color: var(--blue); }
    .msg-type-system { background: rgba(125,133,144,0.15); color: var(--text-dim); }
    .msg-type-feedback { background: rgba(219,109,40,0.15); color: var(--orange); }
    .msg-type-approval { background: rgba(63,185,80,0.15); color: var(--green); }
    .msg-type-review_request { background: rgba(210,153,34,0.15); color: var(--yellow); }
    .msg-type-task_complete { background: rgba(63,185,80,0.15); color: var(--green); }
    .msg-type-release { background: rgba(188,140,255,0.15); color: var(--purple); }
    .msg-text { color: var(--text); word-break: break-word; flex: 1; }

    /* --- Plan --- */
    .activity-fields { display: grid; gap: 12px; margin: 16px 0 0; }
    .activity-fields dt { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .activity-fields dd { margin: 0; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .activity-warning { border-left: 3px solid var(--yellow); padding: 10px; background: var(--surface2); margin-top: 12px; }
    .feed-toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:end; padding:16px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-bottom:16px; }
    .feed-toolbar label { display:grid; gap:6px; color:var(--text-dim); font-size:12px; }
    .feed-toolbar input, .feed-toolbar select, .activity-link { background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:10px; min-height:44px; }
    .feed-toolbar input[type=checkbox] { min-height:20px; width:20px; }
    .activity-link { cursor:pointer; margin-top:12px; }
    .activity-link:focus-visible, .feed-toolbar :focus-visible, .timeline-entry summary:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .feed-caption { color:var(--text-dim); font-size:12px; margin:12px 0; }
    .timeline-entry { margin:0 0 12px 12px; padding:16px 20px; border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; background:var(--surface); }
    .timeline-heading { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px; }
    .timeline-heading time { margin-left:auto; color:var(--text-dim); font:12px monospace; }
    .timeline-body { white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; line-height:1.7; }
    .timeline-entry summary { cursor:pointer; padding:8px 0; color:var(--accent); }
    .tab { flex-shrink:0; min-height:44px; background:transparent; border-top:0; border-left:0; border-right:0; }
    .tab:focus-visible { outline:2px solid var(--accent); outline-offset:-3px; }
    .header, .header-left, .header-right { flex-wrap:wrap; min-width:0; }
    .header-session { overflow-wrap:anywhere; min-width:0; }
    .main, [id^=panel-] { min-width:0; }
    .feed-toolbar input, .feed-toolbar select { max-width:100%; min-width:0; }
    @media(prefers-reduced-motion:reduce) { *, *::before, *::after { transition:none !important; } }
    @media(max-width:600px) { .feed-toolbar label { flex:1 1 100%; } .timeline-entry { margin-left:0; padding:14px; } .agents-grid { grid-template-columns:minmax(0,1fr); } }

    .plan-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .plan-title { font-weight: 600; font-size: 16px; }
    .progress-bar {
      flex: 1; max-width: 200px; height: 6px;
      background: var(--surface2); border-radius: 3px; overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.3s; }
    .plan-pct { font-size: 13px; color: var(--text-dim); font-weight: 600; }
    .plan-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; }
    .plan-check { font-size: 16px; width: 20px; text-align: center; }
    .plan-check.done { color: var(--green); }
    .plan-check.progress { color: var(--cyan); }
    .plan-check.blocked { color: var(--red); }
    .plan-check.pending { color: var(--text-muted); }
    .plan-assignee { margin-left: auto; font-size: 11px; color: var(--text-dim);
      background: var(--surface2); padding: 1px 8px; border-radius: 8px; }

    /* --- Stats --- */
    .usage-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
    .usage-agent { padding: 16px; min-width: 0; }
    .usage-agent h3 { margin: 0 0 6px; overflow-wrap: anywhere; }
    .usage-counters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
    .usage-counters dt, .usage-note { color: var(--text-dim); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
    .usage-counters dd { margin: 4px 0 0; font-size: 16px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .usage-limit { margin-top: 12px; font-size: 13px; }
    .usage-limit progress { display: block; width: 100%; height: 8px; margin: 6px 0; accent-color: var(--cyan); }
    .usage-limit.low progress { accent-color: var(--yellow); }
    .usage-limit.expired progress { accent-color: var(--text-muted); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .stat-value { font-size: 24px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    /* --- Files table --- */
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th {
      text-align: left; padding: 8px 12px; color: var(--text-dim);
      font-weight: 600; font-size: 12px; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .table td { padding: 6px 12px; border-bottom: 1px solid var(--border); }

    /* --- Knowledge --- */
    .knowledge-item {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .knowledge-key { font-weight: 600; color: var(--accent); font-size: 13px; }
    .knowledge-cat {
      font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 6px;
      background: rgba(188,140,255,0.15); color: var(--purple);
      text-transform: uppercase; font-weight: 600;
    }
    .knowledge-value { font-size: 13px; color: var(--text); margin-top: 4px; }
    .knowledge-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* --- Empty state --- */
    .empty { text-align: center; padding: 40px; color: var(--text-dim); }
    .empty-icon { font-size: 32px; margin-bottom: 8px; opacity: 0.5; }

    /* --- Session Picker (command-palette style) --- */
    .picker-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 100; display: none; align-items: flex-start; justify-content: center;
      padding-top: 80px;
    }
    .picker-overlay.open { display: flex; }
    .picker {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; width: 480px; max-height: 420px;
      display: flex; flex-direction: column; box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    .picker-search {
      padding: 12px 14px; border: none; border-bottom: 1px solid var(--border);
      background: transparent; color: var(--text); font-size: 14px;
      outline: none; width: 100%;
    }
    .picker-search::placeholder { color: var(--text-muted); }
    .picker-list { overflow-y: auto; flex: 1; padding: 4px 0; }
    .picker-group { padding: 6px 14px 2px; font-size: 11px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .picker-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; cursor: pointer; font-size: 13px;
      transition: background 0.1s;
    }
    .picker-item:hover, .picker-item.focused { background: var(--surface2); }
    .picker-item.active { border-left: 3px solid var(--accent); }
    .picker-item-name { flex: 1; font-weight: 500; }
    .picker-item-id { font-size: 11px; color: var(--text-muted); font-family: monospace; }
    .picker-item-time { font-size: 11px; color: var(--text-muted); }
    .picker-empty { padding: 20px; text-align: center; color: var(--text-dim); font-size: 13px; }
    .header-session { cursor: pointer; }
    .header-session:hover { border-color: var(--accent); color: var(--text); }

    /* --- Utilities --- */
    .flex { display: flex; }
    .gap-2 { gap: 8px; }
    .items-center { align-items: center; }
    .hidden { display: none !important; }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* --- Mobile --- */
    @media (max-width: 768px) {
      .agents-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .header { flex-wrap: wrap; }
      .msg-from { min-width: 60px; }
    }

    .conversation-room { display:grid; grid-template-columns:190px minmax(0,1fr) 280px; gap:22px; align-items:start; }
    .conversation-room > * { min-width:0; }
    .conversation-room h1 { font-size:24px; margin:0 0 8px; } .conversation-room h2 { font-size:16px; margin:0 0 12px; }
    .conversation-room button, #session-name, .picker-item { font:inherit; color:var(--text); background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:10px; cursor:pointer; min-height:44px; }
    .conversation-room :focus-visible, #session-name:focus-visible, .picker :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .conversation-nav button { width:100%; text-align:left; margin-bottom:8px; overflow-wrap:anywhere; }
    .conversation-nav [aria-current=true] { border-color:var(--accent); background:linear-gradient(100deg,#16364e,var(--surface)); }
    .conversation-center .msg-feed { height:52vh; overflow:auto; scrollbar-gutter:stable; overflow-anchor:none; }
    #message-events { height:auto; max-height:240px; margin-top:14px; } #message-system { margin-top:18px; }
    .conversation-details { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; max-height:80vh; overflow:auto; }
    .conversation-agent { border-bottom:1px solid var(--border); padding:12px 0; font-size:12px; overflow-wrap:anywhere; }
    .conversation-agent h3 { font-size:14px; margin:0 0 8px; } .conversation-agent p { margin:8px 0; line-height:1.6; }
    .conversation-agent summary { cursor:pointer; color:var(--accent); min-height:32px; } .picker-item { width:100%; text-align:left; }
    @media(max-width:1100px) { .conversation-room { grid-template-columns:160px minmax(0,1fr); } .conversation-details { grid-column:1 / -1; max-height:none; } #conversation-agents { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; } }
    @media(max-width:650px) { .conversation-room { grid-template-columns:minmax(0,1fr); } #conversation-sessions { display:flex; gap:8px; overflow:auto; } #conversation-sessions button { min-width:160px; width:auto; } .conversation-center .msg-feed { height:50vh; } .conversation-nav h2 { display:none; } }
  </style>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span class="conn-dot" id="conn-dot"></span>
        <span class="header-title">multiagents</span>
        <button type="button" class="header-session" id="session-name" title="Chọn phiên làm việc">Đang kết nối… &#9662;</button>
      </div>
      <div class="header-right">
        <span id="session-status-badge" class="badge" style="display:none"></span>
        <span id="agent-count"></span>
        <span id="uptime"></span>
        <span id="ws-status" style="font-size:11px"></span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tab-bar">
      <button type="button" class="tab" data-tab="agents">Agents <span class="tab-badge" id="badge-agents">0</span></button>
      <button type="button" class="tab active" data-tab="messages">Hội thoại <span class="tab-badge" id="badge-messages">0</span></button>
      <button type="button" class="tab" data-tab="plan">Plan <span class="tab-badge" id="badge-plan">-</span></button>
      <button type="button" class="tab" data-tab="knowledge">Knowledge <span class="tab-badge" id="badge-knowledge">0</span></button>
      <button type="button" class="tab" data-tab="files">Files <span class="tab-badge" id="badge-files">0</span></button>
      <button type="button" class="tab" data-tab="stats">Stats <span class="tab-badge" id="badge-stats"></span></button>
      <button class="tab studio-tab" type="button" data-tab="studio" aria-controls="panel-studio">Studio <span class="tab-badge" id="badge-studio">new</span></button>
    </div>

    <!-- Tab panels -->
    <div class="main" id="main">
      <div id="panel-agents" class="hidden"></div>
      <div id="panel-messages"><p role="status">Đang chờ dữ liệu hội thoại…</p></div>
      <div id="panel-plan" class="hidden"></div>
      <div id="panel-knowledge" class="hidden"></div>
      <div id="panel-files" class="hidden"></div>
      <div id="panel-stats" class="hidden"></div>
      <div id="panel-studio" class="hidden" aria-labelledby="studio-title"></div>
    </div>
  </div>

  <!-- Session Picker Overlay -->
  <div class="picker-overlay" id="picker-overlay" role="dialog" aria-modal="true" aria-label="Chọn phiên làm việc">
    <div class="picker">
      <input class="picker-search" id="picker-search" type="text" aria-label="Tìm phiên làm việc" placeholder="Tìm phiên…" autocomplete="off" />
      <div class="picker-list" id="picker-list"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // multiagents Web Dashboard — Frontend
    // =========================================================================

    let state = null;
    let activeTab = "messages";
    let ws = null;
    let wsAttempt = 0;
    let autoScroll = true;
    let messageAgent = "";
    let messageQuery = "";


    // --- WebSocket ---

    function connectWs() {
      const url = `ws://${location.host}/ws`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        wsAttempt = 0;
        document.getElementById("ws-status").textContent = "Đã kết nối";
        document.getElementById("ws-status").style.color = "#3fb950";
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "state") {
            state = msg.data;
            render();
          }
        } catch {}
      };

      ws.onclose = () => {
        document.getElementById("ws-status").textContent = "Mất kết nối, đang thử lại…";
        document.getElementById("ws-status").style.color = "#d29922";
        const delay = Math.min(500 * Math.pow(2, wsAttempt) + Math.random() * 1000, 30000);
        wsAttempt++;
        setTimeout(connectWs, delay);
      };

      ws.onerror = () => ws.close();


    }

    // --- Tab switching ---

    document.getElementById("tab-bar").addEventListener("click", (e) => {
      const tab = e.target.closest(".tab");
      if (!tab) return;
      activeTab = tab.dataset.tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      showPanel(activeTab);
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.target.closest("input,select,textarea,[contenteditable=true]")) return;
      const tabs = ["agents", "messages", "plan", "knowledge", "files", "stats"];
      const num = parseInt(e.key);
      if (num >= 1 && num <= tabs.length) {
        activeTab = tabs[num - 1];
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelector(`[data-tab="${activeTab}"]`)?.classList.add("active");
        showPanel(activeTab);
      }
    });

    function showPanel(tab) {
      document.querySelectorAll("[id^='panel-']").forEach(p => p.classList.add("hidden"));
      const panel = document.getElementById(`panel-${tab}`);
      if (panel) panel.classList.remove("hidden");
      if (state) render();
    }

    // --- Rendering ---

    function render() {
      if (!state) return;
      renderHeader();
      renderBadges();

      switch (activeTab) {
        case "agents": renderAgents(); break;
        case "messages": renderMessages(); break;
        case "plan": renderPlan(); break;
        case "knowledge": renderKnowledge(); break;
        case "files": renderFiles(); break;
        case "stats": renderStats(); break;
      }
    }

    function isSessionComplete() {
      if (!state || !state.slots.length) return false;
      const allDisconnected = state.slots.every(s => s.status === "disconnected");
      if (!allDisconnected) return false;
      // Terminal: all agents finished their work (approved/released/done_pending_review with no active reviewers)
      const allDone = state.slots.every(s =>
        s.task_state === "approved" || s.task_state === "released"
      );
      return allDone;
    }

    function renderHeader() {
      const dot = document.getElementById("conn-dot");
      const complete = isSessionComplete();
      const sessionStatus = state.session?.status;
      const isArchived = sessionStatus === "archived";
      const isPaused = sessionStatus === "paused";

      // Dot color: green=active, yellow=paused, dim=completed/archived, red=broker down
      if (!state.brokerAlive) {
        dot.className = "conn-dot dead";
        dot.style.background = "";
        dot.style.boxShadow = "";
      } else if (isArchived || complete) {
        dot.className = "conn-dot";
        dot.style.background = "var(--text-muted)";
        dot.style.boxShadow = "none";
      } else if (isPaused) {
        dot.className = "conn-dot";
        dot.style.background = "var(--yellow)";
        dot.style.boxShadow = "0 0 6px var(--yellow)";
      } else {
        dot.className = "conn-dot alive";
        dot.style.background = "";
        dot.style.boxShadow = "";
      }

      const name = document.getElementById("session-name");
      name.textContent = (state.session?.name ?? state.sessionId ?? "Chưa chọn phiên") + " \u25BE";

      // Status badge
      const statusBadge = document.getElementById("session-status-badge");
      if (isArchived) {
        statusBadge.textContent = "Đã lưu trữ";
        statusBadge.className = "badge badge-released";
        statusBadge.style.display = "";
      } else if (isPaused) {
        statusBadge.textContent = "Tạm dừng";
        statusBadge.className = "badge badge-review";
        statusBadge.style.display = "";
      } else if (complete) {
        statusBadge.textContent = "Đã ghi phê duyệt / giải phóng, chưa xác minh bàn giao";
        statusBadge.className = "badge badge-approved";
        statusBadge.style.display = "";
      } else {
        statusBadge.style.display = "none";
      }

      const connected = state.slots.filter(s => s.status === "connected").length;
      document.getElementById("agent-count").textContent = `${connected}/${state.slots.length} worker kết nối`;

      // Timer: show final duration for completed/archived sessions, live for active
      if (state.session?.created_at) {
        let endTime = Date.now();
        if (complete || isArchived) {
          // Use the latest signal: last_active_at, last message, or last slot disconnect
          const candidates = [state.session.last_active_at || 0];
          if (state.messages.length) {
            const lastMsg = state.messages[state.messages.length - 1];
            const msgTime = lastMsg.sent_at ? new Date(lastMsg.sent_at).getTime() : 0;
            if (msgTime > 0) candidates.push(msgTime);
          }
          for (const slot of state.slots) {
            if (slot.last_disconnected) candidates.push(slot.last_disconnected);
          }
          endTime = Math.max(...candidates);
          if (endTime <= state.session.created_at) endTime = state.session.created_at;
        }
        const elapsed = Math.round((endTime - state.session.created_at) / 1000);
        const h = Math.floor(elapsed / 3600);
        const m = Math.floor((elapsed % 3600) / 60);
        const s = elapsed % 60;
        let timeStr = "";
        if (h > 0) timeStr = `${h}h ${m}m ${s}s`;
        else if (m > 0) timeStr = `${m}m ${s}s`;
        else timeStr = `${s}s`;
        document.getElementById("uptime").textContent = timeStr;
      } else document.getElementById("uptime").textContent = "";
    }

    function renderBadges() {
      const connected = state.slots.filter(s => s.status === "connected").length;
      document.getElementById("badge-agents").textContent = connected;
      document.getElementById("badge-messages").textContent = state.messages.length;
      document.getElementById("badge-plan").textContent = state.plan?.completion != null ? `${state.plan.completion}%` : "-";
      document.getElementById("badge-knowledge").textContent = state.knowledge?.length ?? 0;
      document.getElementById("badge-files").textContent = state.fileLocks.length + state.fileOwnership.length;

      const warnings = state.guardrails.filter(g => g.status === "warning" || g.status === "triggered").length;
      document.getElementById("badge-stats").textContent = warnings > 0 ? `${warnings}!` : "";
    }

    // --- Agents panel ---

    function taskBadge(taskState) {
      const map = {
        idle: "badge-idle",
        working: "badge-working",
        done_pending_review: "badge-review",
        addressing_feedback: "badge-feedback",
        approved: "badge-approved",
        released: "badge-released",
      };
      const label = {
        idle: "idle",
        working: "working",
        done_pending_review: "in review",
        addressing_feedback: "fixing",
        approved: "approved",
        released: "released",
      };
      return `<span class="badge ${map[taskState] ?? "badge-idle"}">${esc(label[taskState] ?? taskState)}</span>`;
    }

    function connBadge(status) {
      return status === "connected"
        ? '<span class="badge badge-connected">connected</span>'
        : '<span class="badge badge-disconnected">disconnected</span>';
    }

    function renderAgents() {
      const el = document.getElementById("panel-agents");
      if (!state.slots.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">~</div>No agents in session</div>';
        return;
      }
      // Match peers to slots for summary
      const peerMap = new Map(state.peers.map(p => [p.id, p]));
      const html = state.slots.map(slot => {
        const peer = slot.peer_id ? peerMap.get(slot.peer_id) : null;
        let snapshot = {};
        try { snapshot = JSON.parse(slot.context_snapshot || "{}"); } catch {}
        const assigned = (state.plan?.items || []).filter(i => i.assigned_to_slot === slot.id && i.status !== "done");
        const owned = state.fileOwnership.filter(f => f.slot_id === slot.id);
        const locked = state.fileLocks.filter(f => f.held_by_slot === slot.id);
        const updated = snapshot.updated_at || slot.last_connected;
        const stale = slot.status === "connected" && updated && Date.now() - updated > 60000;
        const reported = state.messages.filter(m => m.from_slot_id === slot.id).sort((a,b) => new Date(b.sent_at) - new Date(a.sent_at))[0];
        const summary = peer?.summary ?? (slot.context_snapshot ? (() => {
          try { return JSON.parse(slot.context_snapshot)?.last_summary; } catch { return null; }
        })() : null);
        const tokens = renderUsage(slot);
        return `<div class="agent-card">
          <div class="agent-top">
            <span class="agent-name">${esc(slot.display_name ?? `Slot ${slot.id}`)}</span>
            ${connBadge(slot.status)}
          </div>
          <div class="agent-role">${esc(slot.role ?? slot.agent_type ?? "")}</div>
          <div class="flex gap-2 items-center">
            <span>Workflow:</span> ${taskBadge(slot.task_state ?? "idle")}
            <span style="font-size:11px;color:var(--text-muted)">${slot.agent_type}</span>
          </div>
          ${tokens}
          <dl class="activity-fields">
            <div><dt>Assigned task / active plan</dt><dd>${esc(snapshot.current_task || assigned.map(i => i.label).join("\n") || "No active plan item assigned")}</dd></div>
            <div><dt>Latest observed step</dt><dd>${esc(snapshot.last_summary || summary || "No activity reported")}</dd></div>
            <div><dt>Files (locks / ownership, not proof of edits)</dt><dd>${esc([...locked.map(f => f.file_path), ...owned.map(f => f.path_pattern)].filter(Boolean).join("\n") || "No file activity reported")}</dd></div>
            <div><dt>Last activity</dt><dd>${updated ? esc(new Date(updated).toLocaleString()) : "Not recorded"}${slot.status !== "connected" ? " - worker offline" : ""}</dd></div>
            <div><dt>Test results</dt><dd>Not independently verified. See agent reports in Messages.</dd></div>
            <div><dt>Blockers</dt><dd>${esc(snapshot.blocker || (assigned.some(i => i.status === "blocked") ? "An assigned plan item is blocked. See Messages for details." : "No explicit blocker recorded; this does not confirm successful execution."))}</dd></div>
            <div><dt>Review</dt><dd>${slot.task_state === "approved" ? "Recorded approval - not independent proof of delivery" : slot.task_state === "done_pending_review" ? "Awaiting reviewer" : "No approval for current work"}</dd></div>
          </dl>
          ${stale ? '<div class="activity-warning">Needs inspection: no recent activity. Completion is not confirmed.</div>' : ""}
          <details class="agent-summary"><summary>Latest agent report</summary>${esc(reported?.text || "No report received")}</details>
          <button class="activity-link" data-agent-messages="${Number(slot.id)}">View messages</button>
        </div>`;
      }).join("");
      el.innerHTML = `<div class="agents-grid">${html}</div>`;
    }

    document.getElementById("panel-agents").addEventListener("click", e => {
      const button = e.target.closest("[data-agent-messages]");
      if (!button) return;
      messageAgent = button.dataset.agentMessages;
      document.querySelector('[data-tab="messages"]').click();
      renderMessages(true);
    });

    // --- Messages panel ---

    function patchTimeline(feed, messages, slotMap) {
      const keep = new Set(messages.map(m => String(m.id)));
      for (const row of [...feed.children]) if (!keep.has(row.dataset.messageId)) row.remove();
      const rows = new Map([...feed.children].map(row => [row.dataset.messageId, row]));
      for (const [index, m] of messages.entries()) {
        const key = String(m.id);
        const fromSlot = slotMap.get(m.from_slot_id);
        const from = fromSlot?.display_name || m.from_id || "Không có ID người gửi";
        const to = slotMap.get(m.to_slot_id)?.display_name || m.to_id || "Nhóm";
        const version = JSON.stringify([m, from, to]);
        let row = rows.get(key);
        if (!row) { row = document.createElement("article"); row.className = "timeline-entry"; row.dataset.messageId = key; }
        // Filtering can retain a later row; restore order without rebuilding its content.
        if (feed.children[index] !== row) feed.insertBefore(row, feed.children[index] || null);
        if (row?.dataset.version === version) continue;
        const open = row.querySelector("details")?.open;
        const heading = document.createElement("header"); heading.className = "timeline-heading";
        const sender = document.createElement("strong"); sender.textContent = from;
        const route = document.createElement("span"); route.textContent = (fromSlot ? "AI · " : "") + "gửi " + to;
        const type = document.createElement("span"); type.className = "badge badge-idle"; type.textContent = m.msg_type;
        const time = document.createElement("time"); const date = new Date(m.sent_at);
        time.textContent = Number.isNaN(date.getTime()) ? "Chưa có thời điểm" : date.toLocaleString("vi-VN");
        heading.append(sender, route, type, time);
        const body = document.createElement("div"); body.className = "timeline-body"; body.textContent = m.text || "";
        row.replaceChildren(heading);
        if ((m.text || "").length > 600) {
          const details = document.createElement("details"); details.dataset.messageId = key; details.open = Boolean(open);
          const summary = document.createElement("summary"); summary.textContent = m.text.slice(0,160) + " … Đọc đầy đủ";
          details.append(summary, body); row.append(details);
        } else row.append(body);
        row.dataset.version = version;
      }
      if (!messages.length && !feed.children.length) { const empty = document.createElement("p"); empty.className = "empty"; empty.textContent = "Chưa có bản ghi phù hợp."; feed.append(empty); }
    }

    function renderMessages(force = false) {
      const el = document.getElementById("panel-messages");
      const changedSession = el.dataset.session !== (state.sessionId || "");
      if (!el.querySelector(".feed-toolbar")) {
        el.innerHTML = '<div class="conversation-room"><nav class="conversation-nav" aria-label="Phiên làm việc"><h2>Phiên làm việc</h2><button type="button" id="conversation-switch">Tìm / đổi phiên</button><div id="conversation-sessions"></div></nav><section class="conversation-center" aria-labelledby="conversation-heading"><h1 id="conversation-heading">Hội thoại của nhóm</h1><p class="feed-caption">Tin nhắn thật của worker AI và người điều hành. Chỉ xem; dùng @multiagents trong VS Code Chat để điều phối và xác nhận điều khiển.</p><div class="feed-toolbar"><label>Worker<select id="message-agent"><option value="">Tất cả worker</option></select></label><label>Tìm nội dung<input id="message-query" type="search" placeholder="Nhiệm vụ, file, kiểm thử hoặc vướng mắc"></label><label><input id="message-live" type="checkbox" checked>Theo tin mới</label></div><p id="conversation-error" role="alert"></p><p class="feed-caption" id="message-count" role="status"></p><div class="msg-feed" id="message-timeline" role="region" tabindex="0" aria-label="Lịch sử hội thoại"></div><button id="message-latest" type="button" hidden>Đến tin mới nhất</button><details id="message-system"><summary>Sự kiện hệ thống / điều khiển</summary><div class="msg-feed" id="message-events"></div></details></section><aside class="conversation-details" aria-label="Worker, nhiệm vụ và mức sử dụng"><h2>Nhóm đang làm gì</h2><div id="conversation-agents"></div></aside></div>';
        el.querySelector("#message-agent").onchange = e => { messageAgent=e.target.value; renderMessages(true); };
        el.querySelector("#message-query").oninput = e => { messageQuery=e.target.value; renderMessages(true); };
        el.querySelector("#message-live").onchange = e => { autoScroll=e.target.checked; renderMessages(true); };
        el.querySelector("#message-latest").onclick = () => { autoScroll=true; el.querySelector("#message-live").checked=true; renderMessages(true); const feed=el.querySelector("#message-timeline"); feed.scrollTop=feed.scrollHeight; };
        el.querySelector("#conversation-switch").onclick = openPicker;
        el.querySelector("#message-timeline").addEventListener("scroll", e => {
          const feed = e.currentTarget;
          if (feed.scrollHeight - feed.scrollTop - feed.clientHeight > 60) { autoScroll=false; el.querySelector("#message-live").checked=false; }
        });
        fetchSessions();
      }
      if (changedSession) {
        messageAgent=""; messageQuery=""; autoScroll=true; force=true;
        el.querySelector("#message-query").value=""; el.querySelector("#message-live").checked=true;
        el.querySelector("#message-timeline").replaceChildren(); el.querySelector("#message-events").replaceChildren();
        el.dataset.session=state.sessionId || "";
      }
      const nav = el.querySelector("#conversation-sessions");
      const navKey = JSON.stringify([allSessions, state.sessionId]);
      if (nav.dataset.version !== navKey) {
        nav.replaceChildren(...allSessions.slice(0,50).map(session => {
          const button=document.createElement("button"); button.type="button"; button.textContent=(session.name || session.id) + " · " + session.status;
          button.setAttribute("aria-current", String(session.id===state.sessionId)); button.onclick=()=>selectSession(session.id); return button;
        }));
        nav.dataset.version=navKey;
      }
      const slotMap = new Map(state.slots.map(slot => [slot.id,slot]));
      const select = el.querySelector("#message-agent");
      const optionKey=JSON.stringify(state.slots.map(slot=>[slot.id,slot.display_name]));
      if (select.dataset.version !== optionKey) {
        const all=document.createElement("option"); all.value=""; all.textContent="Tất cả worker";
        select.replaceChildren(all,...state.slots.map(slot=>{const option=document.createElement("option"); option.value=String(slot.id); option.textContent=slot.display_name || "Worker " + slot.id; return option;}));
        select.dataset.version=optionKey;
      }
      select.value=messageAgent;
      const matches=state.messages.slice(-200).filter(m =>
        (!messageAgent || m.from_slot_id===Number(messageAgent) || m.to_slot_id===Number(messageAgent)) &&
        (!messageQuery || [m.text,slotMap.get(m.from_slot_id)?.display_name,m.from_id,slotMap.get(m.to_slot_id)?.display_name,m.to_id].join(" ").toLowerCase().includes(messageQuery.toLowerCase()))
      ).sort((a,b)=>a.id-b.id);
      const system=m=>["system","control","team_change"].includes(m.msg_type);
      const messages=matches.filter(m=>!system(m));
      const caption=(!state.brokerAlive ? "Broker không kết nối. Dữ liệu có thể cũ. " : "") + messages.length + " tin phù hợp / " + state.messages.length + " bản ghi tải gần nhất (tối đa 200). Báo cáo chưa được xác minh độc lập.";
      if(el.querySelector("#message-count").textContent!==caption) el.querySelector("#message-count").textContent=caption;
      const feed=el.querySelector("#message-timeline");
      const version=JSON.stringify([messages,optionKey]);
      if (!autoScroll && !force && feed.dataset.rendered) {
        el.querySelector("#message-latest").hidden=feed.dataset.version===version;
      } else {
        const scroll=feed.scrollTop;
        patchTimeline(feed,messages,slotMap);
        if(autoScroll) feed.scrollTop=feed.scrollHeight; else feed.scrollTop = scroll;
        feed.dataset.version=version; feed.dataset.rendered="1";
        el.querySelector("#message-latest").hidden=true;
      }
      patchTimeline(el.querySelector("#message-events"), matches.filter(system), slotMap);
      const info=el.querySelector("#conversation-agents");
      const infoKey=JSON.stringify([state.slots,state.plan,Math.floor(Date.now()/60000)]);
      if(info.dataset.version!==infoKey) {
        const opened=new Set([...info.querySelectorAll("details[open]")].map(d=>d.dataset.slot));
        info.innerHTML=state.slots.map(slot=>'<section class="conversation-agent"><h3>' + esc(slot.display_name || 'Worker ' + slot.id) + ' · AI</h3><p>' + esc(slot.status) + ' · ' + esc(slot.task_state) + '</p><p>' + esc((state.plan?.items || []).filter(item=>item.assigned_to_slot===slot.id && item.status!=="done").map(item=>item.label).join("; ") || "Chưa có nhiệm vụ đang làm trong kế hoạch") + '</p><details data-slot="' + Number(slot.id) + '"><summary>Token và hạn mức provider</summary>' + renderUsage(slot) + '</details></section>').join("") || '<p>Phiên chưa có worker.</p>';
        info.querySelectorAll("details").forEach(d=>d.open=opened.has(d.dataset.slot));
        info.dataset.version=infoKey;
      }
    }

    // --- Plan panel ---

    function renderPlan() {
      const el = document.getElementById("panel-plan");
      if (!state.plan?.plan) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">~</div>No plan created</div>';
        return;
      }
      const { plan, items, completion } = state.plan;
      const slotMap = new Map(state.slots.map(s => [s.id, s]));
      const statusIcon = { done: '<span class="plan-check done">&#10003;</span>',
        in_progress: '<span class="plan-check progress">&#9654;</span>',
        blocked: '<span class="plan-check blocked">&#10007;</span>',
        pending: '<span class="plan-check pending">&#9675;</span>' };
      const itemsHtml = items.map(item => {
        const icon = statusIcon[item.status] ?? statusIcon.pending;
        const assignee = item.assigned_to_slot ? slotMap.get(item.assigned_to_slot)?.display_name : null;
        const dimClass = item.status === "done" ? 'style="opacity:0.5"' : "";
        return `<div class="plan-item" ${dimClass}>
          ${icon}
          <span>${esc(item.label)}</span>
          ${assignee ? `<span class="plan-assignee">${esc(assignee)}</span>` : ""}
        </div>`;
      }).join("");

      el.innerHTML = `<div class="card">
        <div class="card-header">
          <div class="plan-header">
            <span class="plan-title">${esc(plan.title)}</span>
            <div class="progress-bar"><div class="progress-fill" style="width:${completion}%"></div></div>
            <span class="plan-pct">${completion}%</span>
          </div>
        </div>
        <div style="padding:12px 14px">${itemsHtml}</div>
      </div>`;
    }

    // --- Knowledge panel ---

    function renderKnowledge() {
      const el = document.getElementById("panel-knowledge");
      const entries = state.knowledge ?? [];
      if (!entries.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">~</div>No knowledge entries. Agents will store decisions and discoveries here.</div>';
        return;
      }
      const html = entries.map(e => {
        const by = e.created_by_name ? `by ${esc(e.created_by_name)}` : "";
        const ago = timeSince(e.updated_at);
        return `<div class="knowledge-item">
          <div><span class="knowledge-key">${esc(e.key)}</span><span class="knowledge-cat">${esc(e.category)}</span></div>
          <div class="knowledge-value">${esc(e.value)}</div>
          <div class="knowledge-meta">${by}${by && ago ? " \u00b7 " : ""}${ago}</div>
        </div>`;
      }).join("");
      el.innerHTML = `<div class="card"><div class="card-header">Shared Knowledge <span style="font-size:12px;color:var(--text-dim)">(${entries.length})</span></div>${html}</div>`;
    }

    // --- Files panel ---

    function renderFiles() {
      const el = document.getElementById("panel-files");
      const slotMap = new Map(state.slots.map(s => [s.id, s]));
      let html = "";

      if (state.fileOwnership.length) {
        const rows = state.fileOwnership.map(o => {
          const owner = slotMap.get(o.slot_id)?.display_name ?? `Slot ${o.slot_id}`;
          return `<tr><td>${esc(o.path_pattern)}</td><td>${esc(owner)}</td><td style="color:var(--text-dim)">${esc(o.assigned_by ?? "")}</td></tr>`;
        }).join("");
        html += `<div class="card"><div class="card-header">Ownership Zones</div>
          <table class="table"><thead><tr><th>Pattern</th><th>Owner</th><th>Assigned By</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }

      if (state.fileLocks.length) {
        const rows = state.fileLocks.map(l => {
          const holder = slotMap.get(l.held_by_slot)?.display_name ?? `Slot ${l.held_by_slot}`;
          return `<tr><td>${esc(l.file_path)}</td><td>${esc(holder)}</td><td>${l.lock_type}</td></tr>`;
        }).join("");
        html += `<div class="card"><div class="card-header">Active Locks</div>
          <table class="table"><thead><tr><th>File</th><th>Held By</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }

      if (!html) {
        html = '<div class="empty"><div class="empty-icon">~</div>No file locks or ownership zones</div>';
      }
      el.innerHTML = html;
    }

    // --- Stats panel ---

    function usageData(slot) {
      try { return JSON.parse(slot.agent_usage || "null"); } catch { return null; }
    }
    function observedTokens(slot) {
      return Boolean(usageData(slot)?.tokensObservedAt);
    }
    function tokenText(slot, field) {
      if (!observedTokens(slot) || !Number.isSafeInteger(slot[field]) || slot[field] < 0) return "Chưa được báo cáo";
      return slot[field].toLocaleString("en-US");
    }
    function renderUsage(slot) {
      const data = usageData(slot);
      const windows = Object.values(data?.quotas || {}).flatMap(bucket => [bucket.primary, bucket.secondary].filter(Boolean));
      const quotaHtml = [300, 10080].map(minutes => {
        const label = minutes === 300 ? "5 giờ" : "Hằng tuần";
        const matches = windows.filter(w => w.windowMinutes === minutes && Number.isFinite(w.usedPercent) && w.usedPercent >= 0 && w.usedPercent <= 100 && Number.isFinite(w.observedAt));
        if (!matches.length) return `<div class="usage-limit"><strong>${label}</strong><div class="usage-note">Provider chưa báo cáo</div></div>`;
        return matches.map((w, i) => {
          const remaining = Math.round((100 - w.usedPercent) * 10) / 10;
          const expired = Boolean(w.resetsAt && w.resetsAt <= Date.now());
          const stale = Date.now() - w.observedAt > 300000 || slot.status !== "connected" || expired;
          const windowLabel = `${label}${matches.length > 1 ? ` bucket ${i + 1}` : ""}`;
          return `<div class="usage-limit ${expired ? "expired" : remaining <= 20 ? "low" : ""}">
            <strong>${windowLabel}: ${remaining}% còn lại${stale ? " (báo cáo gần nhất)" : ""}</strong>
            <progress max="100" value="${remaining}" aria-label="${esc(windowLabel)} còn lại: ${remaining}%${stale ? ", báo cáo gần nhất" : ""}"></progress>
            <div class="usage-note">${w.usedPercent}% đã dùng. ${w.resetsAt ? `Đặt lại ${esc(new Date(w.resetsAt).toLocaleString())}${expired ? " - đang chờ cập nhật" : ""}` : "Chưa báo thời điểm đặt lại"}<br>Ghi nhận ${esc(new Date(w.observedAt).toLocaleString())}</div>
          </div>`;
        }).join("");
      }).join("");
      return `<section aria-label="Token và hạn mức provider">
        <dl class="usage-counters"><div><dt>Input</dt><dd>${tokenText(slot, "input_tokens")}</dd></div><div><dt>Cached input</dt><dd>${tokenText(slot, "cache_read_tokens")}</dd></div><div><dt>Output</dt><dd>${tokenText(slot, "output_tokens")}</dd></div></dl>
        <div class="usage-note">${data?.tokensObservedAt ? `Tổng đã ghi nhận; cached đã nằm trong input. Cập nhật ${esc(new Date(data.tokensObservedAt).toLocaleString())}.` : "Chưa nhận báo cáo token được hỗ trợ. Không phải số 0 đo được."}</div>
        ${quotaHtml}<p class="usage-note">Hạn mức provider/tài khoản có thể dùng chung với worker khác. Đây không phải ngân sách riêng của worker, không suy ra từ số token.</p>
      </section>`;
    }

    function renderStats() {
      const el = document.getElementById("panel-stats");

      // Session metrics
      const connected = state.slots.filter(s => s.status === "connected").length;
      const working = state.slots.filter(s => s.task_state === "working").length;
      const approved = state.slots.filter(s => s.task_state === "approved" || s.task_state === "released").length;
      const measured = state.slots.filter(observedTokens);
      const total = field => measured.length ? fmtTokens(measured.reduce((a, s) => a + (s[field] ?? 0), 0)) : "Not reported";

      const statsCards = [
        { value: connected, label: "Connected Agents", color: "var(--green)" },
        { value: working, label: "Working", color: "var(--blue)" },
        { value: approved, label: "Approved", color: "var(--green)" },
        { value: state.messages.length, label: "Messages", color: "var(--cyan)" },
        { value: total("input_tokens"), label: "Observed Input Tokens", color: "var(--cyan)" },
        { value: total("cache_read_tokens"), label: "Observed Cached Input", color: "var(--cyan)" },
        { value: total("output_tokens"), label: "Observed Output Tokens", color: "var(--cyan)" },
      ];

      const cardsHtml = statsCards.map(s =>
        `<div class="stat-card"><div class="stat-value" style="color:${s.color}">${s.value}</div><div class="stat-label">${s.label}</div></div>`
      ).join("");

      // Guardrails
      let guardrailHtml = "";
      const enforced = state.guardrails.filter(g => g.action !== "monitor");
      if (enforced.length) {
        guardrailHtml = `<div class="card" style="margin-top:16px"><div class="card-header">Guardrails</div>
          <div style="padding:12px 14px">${enforced.map(g => {
            const pct = g.current_value && g.default_value ? Math.min(100, Math.round((g.current_value / g.default_value) * 100)) : 0;
            const color = g.status === "triggered" ? "var(--red)" : g.status === "warning" ? "var(--yellow)" : "var(--green)";
            return `<div style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(g.label)}</span><span style="color:${color}">${g.current_value}/${g.default_value} ${g.unit ?? ""}</span></div>
              <div class="progress-bar" style="margin-top:4px"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
            </div>`;
          }).join("")}</div></div>`;
      }

      const agentUsage = state.slots.map(slot => `<article class="card usage-agent"><h3>${esc(slot.display_name || `Slot ${slot.id}`)}</h3><div class="usage-note">${esc(slot.model_selection?.provider || slot.agent_type)} / ${esc(slot.model_selection?.model || "default model")}</div>${renderUsage(slot)}</article>`).join("");
      el.innerHTML = `<div class="stats-grid">${cardsHtml}</div><p class="usage-note">Token coverage: ${measured.length}/${state.slots.length} agents. Totals may be partial; no billing estimate. Input includes cached input.</p><div class="usage-grid">${agentUsage}</div>${guardrailHtml}`;
    }

    // --- Helpers ---

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + "..." : s; }
    function fmtTokens(n) {
      if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(1)}M`;
      if (n >= 1_000) return `${(n / 1_000).toFixed(1)}k`;
      return String(n);
    }
    function fmtTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleTimeString("en-US", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
      } catch { return ""; }
    }
    function timeSince(epoch) {
      if (!epoch) return "";
      const s = Math.round((Date.now() - epoch) / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      return `${h}h ago`;
    }

    // --- Session Picker ---

    let allSessions = [];
    let pickerFocusIdx = 0;
    let pickerFiltered = [];

    function openPicker() {
      const overlay = document.getElementById("picker-overlay");
      const search = document.getElementById("picker-search");
      overlay.classList.add("open");
      search.value = "";
      search.focus();
      fetchSessions();
    }

    function closePicker() {
      const overlay=document.getElementById("picker-overlay");
      if (!overlay.classList.contains("open")) return;
      overlay.classList.remove("open");
      document.getElementById("session-name").focus();
    }

    async function fetchSessions() {
      try {
        const res = await fetch("/api/sessions");
        if (!res.ok) throw new Error("Không tải được danh sách phiên.");
        allSessions = await res.json();
        // Sort: active first, then paused, then archived; within each group by most recent
        allSessions.sort((a, b) => {
          const order = { active: 0, paused: 1, archived: 2 };
          const so = (order[a.status] ?? 3) - (order[b.status] ?? 3);
          if (so !== 0) return so;
          return (b.last_active_at ?? b.created_at ?? 0) - (a.last_active_at ?? a.created_at ?? 0);
        });
        renderPicker();
        if(activeTab==="messages" && state) renderMessages();
      } catch { allSessions = []; document.getElementById("picker-list").textContent="Không tải được phiên. Kiểm tra kết nối rồi thử lại."; }
    }

    function renderPicker() {
      const search = document.getElementById("picker-search").value.toLowerCase();
      pickerFiltered = allSessions.filter(s =>
        !search || s.name?.toLowerCase().includes(search) || s.id.toLowerCase().includes(search)
      );
      pickerFocusIdx = Math.min(pickerFocusIdx, Math.max(0, pickerFiltered.length - 1));

      const list = document.getElementById("picker-list");
      if (!pickerFiltered.length) {
        list.innerHTML = '<div class="picker-empty">Không tìm thấy phiên</div>';
        return;
      }

      let html = "";
      let lastStatus = "";
      pickerFiltered.forEach((s, i) => {
        if (s.status !== lastStatus) {
          lastStatus = s.status;
          const label = s.status === "active" ? "Đang hoạt động" : s.status === "paused" ? "Tạm dừng" : "Đã lưu trữ";
          html += `<div class="picker-group">${label}</div>`;
        }
        const isCurrent = state?.sessionId === s.id;
        const focused = i === pickerFocusIdx ? " focused" : "";
        const active = isCurrent ? " active" : "";
        const age = timeSince(s.last_active_at ?? s.created_at);
        const statusDot = s.status === "active"
          ? '<span style="color:var(--green)">&#9679;</span>'
          : s.status === "paused"
            ? '<span style="color:var(--yellow)">&#9679;</span>'
            : '<span style="color:var(--text-muted)">&#9679;</span>';
        html += `<button type="button" class="picker-item${focused}${active}" data-idx="${i}" data-id="${esc(s.id)}">
          ${statusDot}
          <span class="picker-item-name">${esc(s.name || s.id)}</span>
          <span class="picker-item-id">${esc(s.id.length > 24 ? s.id.slice(0, 24) + "..." : s.id)}</span>
          <span class="picker-item-time">${age}</span>
        </button>`;
      });
      list.innerHTML = html;

      // Scroll focused into view
      const focusedEl = list.querySelector(".focused");
      if (focusedEl) focusedEl.scrollIntoView({ block: "nearest" });
    }

    async function selectSession(id) {
      const error = document.getElementById("conversation-error");
      if(error) error.textContent="";
      try {
        const response = await fetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: id }),
        });
        if(!response.ok) throw new Error("Không đổi được phiên.");
        closePicker();
      } catch { const message="Không đổi được phiên. Hãy thử lại; phiên hiện tại được giữ nguyên."; document.getElementById("picker-list").textContent=message; if(error) error.textContent=message; }
    }

    // Click session name to open picker
    document.getElementById("session-name").addEventListener("click", openPicker);

    // Close on overlay click (not picker body)
    document.getElementById("picker-overlay").addEventListener("click", (e) => {
      if (e.target.id === "picker-overlay") closePicker();
    });

    // Search input
    document.getElementById("picker-search").addEventListener("input", () => {
      pickerFocusIdx = 0;
      renderPicker();
    });

    // Click on picker item
    document.getElementById("picker-list").addEventListener("click", (e) => {
      const item = e.target.closest(".picker-item");
      if (item) selectSession(item.dataset.id);
    });

    // Keyboard navigation in picker
    document.getElementById("picker-search").addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closePicker(); e.preventDefault(); return; }
      if (e.key === "ArrowDown") { pickerFocusIdx = Math.min(pickerFocusIdx + 1, pickerFiltered.length - 1); renderPicker(); e.preventDefault(); return; }
      if (e.key === "ArrowUp") { pickerFocusIdx = Math.max(pickerFocusIdx - 1, 0); renderPicker(); e.preventDefault(); return; }
      if (e.key === "Enter" && pickerFiltered[pickerFocusIdx]) { selectSession(pickerFiltered[pickerFocusIdx].id); e.preventDefault(); return; }
    });

    // Global Escape to close picker
    document.addEventListener("keydown", (e) => {
      const overlay=document.getElementById("picker-overlay");
      if(!overlay.classList.contains("open")) return;
      if (e.key === "Escape") closePicker();
      if(e.key==="Tab") { const items=[...overlay.querySelectorAll("input,button")]; const first=items[0],last=items.at(-1); if(e.shiftKey && document.activeElement===first) { e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement===last) { e.preventDefault(); first.focus(); } }
    });

    // --- Boot ---
    setInterval(() => { if (ws?.readyState === 1) ws.send("ping"); }, 30000);
    connectWs();
  </script>
  <script src="./app.js"></script>
</body>
</html>
