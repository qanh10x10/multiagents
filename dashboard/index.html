<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>multiagents dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #0f172a;
      --surface2: #162036;
      --surface3: #1e2942;
      --border: #1e293b;
      --border-hover: #334155;
      --border-focus: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.12);
      --accent-border: rgba(56, 189, 248, 0.28);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.12);
      --yellow: #f59e0b;
      --yellow-soft: rgba(245, 158, 11, 0.12);
      --orange: #f97316;
      --orange-soft: rgba(249, 115, 22, 0.12);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);
      --purple: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.12);
      --cyan: #06b6d4;
      --cyan-soft: rgba(6, 182, 212, 0.12);
      --blue: #38bdf8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* --- Header --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
    }
    .header-logo-icon {
      width: 22px;
      height: 22px;
      color: var(--accent);
      flex-shrink: 0;
    }
    .header-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .header-session {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      background: var(--surface2);
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }
    .header-session:hover {
      border-color: var(--border-hover);
      color: var(--text);
      background: var(--surface3);
    }
    .conn-dot {
      width: 7px; height: 7px; border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .conn-dot.alive { background: var(--green); box-shadow: 0 0 8px rgba(16,185,129,0.5); }
    .conn-dot.dead { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.5); }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }
    .header-meta-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* --- Tab Bar --- */
    .tabs {
      display: flex;
      overflow-x: auto;
      gap: 4px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      flex-shrink: 0;
    }
    .tab {
      padding: 10px 14px;
      cursor: pointer;
      color: var(--text-dim);
      border-bottom: 2px solid transparent;
      font-size: 12.5px;
      font-weight: 500;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      background: transparent;
      border-top: 0;
      border-left: 0;
      border-right: 0;
      flex-shrink: 0;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      font-weight: 600;
    }
    .tab-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--surface2);
      color: var(--text-muted);
      min-width: 18px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .tab.active .tab-badge {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

    /* --- Main layout --- */
    .main {
      flex: 1;
      overflow: auto;
      padding: 16px;
      min-width: 0;
    }
    .app { display: flex; flex-direction: column; height: 100vh; }

    /* --- Cards --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-header {
      padding: 10px 14px;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* --- Status badges --- */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 550;
      letter-spacing: 0.01em;
      line-height: 1.3;
      border: 1px solid transparent;
    }
    .badge-idle { background: var(--surface2); color: var(--text-dim); border-color: var(--border); }
    .badge-working { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-border); }
    .badge-review { background: var(--yellow-soft); color: var(--yellow); border-color: rgba(245,158,11,0.25); }
    .badge-feedback { background: var(--orange-soft); color: var(--orange); border-color: rgba(249,115,22,0.25); }
    .badge-approved { background: var(--green-soft); color: var(--green); border-color: rgba(16,185,129,0.25); }
    .badge-released { background: var(--surface2); color: var(--text-muted); border-color: var(--border); }
    .badge-connected { background: var(--green-soft); color: var(--green); border-color: rgba(16,185,129,0.25); }
    .badge-disconnected { background: var(--red-soft); color: var(--red); border-color: rgba(239,68,68,0.25); }
    .badge-standby { background: var(--surface2); color: var(--text-dim); border-color: var(--border); }

    /* --- Conversation Room Grid --- */
    .conversation-room {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: stretch;
      min-height: calc(100vh - 110px);
    }
    .conversation-room > * { min-width: 0; }

    /* --- Left Sidebar (Session Nav) --- */
    .conversation-nav {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: calc(100vh - 120px);
    }
    .conversation-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .conversation-nav-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .conversation-nav-switch {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .conversation-nav-switch:hover {
      background: var(--surface3);
      color: var(--text);
      border-color: var(--border-hover);
    }
    .nav-switch-key {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: monospace;
    }
    .conversation-sessions-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
    }
    .session-nav-item {
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: all 0.12s ease;
    }
    .session-nav-item:hover {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--border);
    }
    .session-nav-item[aria-current="true"] {
      background: var(--surface2);
      color: var(--accent);
      border-color: var(--accent-border);
      font-weight: 600;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .session-nav-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12.5px;
    }
    .session-nav-meta {
      font-size: 10.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* --- Center Feed Area --- */
    .conversation-center {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
      height: calc(100vh - 120px);
    }
    .conversation-header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .conversation-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .conversation-subtitle {
      font-size: 12px;
      color: var(--text-dim);
    }

    /* --- Filter Toolbar --- */
    .feed-toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      flex-shrink: 0;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .feed-toolbar select, .feed-toolbar input[type="search"] {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .feed-toolbar select:focus, .feed-toolbar input[type="search"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-border);
    }
    .feed-toolbar input[type="search"] {
      flex: 1;
      min-width: 140px;
    }
    .feed-toolbar input[type="search"]::placeholder {
      color: var(--text-muted);
    }
    .toolbar-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .toolbar-toggle-label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    .feed-caption {
      color: var(--text-muted);
      font-size: 11.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    /* --- Message Timeline --- */
    .msg-feed {
      flex: 1;
      overflow-y: auto;
      scrollbar-gutter: stable;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }
    .timeline-entry {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      transition: border-color 0.12s ease;
    }
    .timeline-entry:hover {
      border-color: var(--border-hover);
    }
    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #090d16;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .msg-avatar .model-svg { width: 20px; height: 20px; }
    .timeline-content {
      flex: 1;
      min-width: 0;
    }
    .timeline-heading {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .timeline-sender {
      font-weight: 650;
      font-size: 13px;
      color: var(--text);
    }
    .timeline-route {
      font-size: 11.5px;
      color: var(--text-dim);
    }
    .timeline-heading time {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 11px;
      font-family: ui-monospace, monospace;
      font-variant-numeric: tabular-nums;
    }
    .timeline-body {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.6;
      color: #e2e8f0;
    }
    .timeline-entry summary {
      cursor: pointer;
      padding: 6px 0;
      color: var(--accent);
      font-size: 12px;
      user-select: none;
    }
    .timeline-entry summary:hover { text-decoration: underline; }

    /* --- System Events Collapsible --- */
    #message-system {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    #message-system summary {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
    }
    #message-system summary:hover {
      color: var(--text);
    }
    #message-events {
      max-height: 200px;
      padding: 8px;
      gap: 6px;
    }

    /* --- Right Rail (Agent Presence & Dossier) --- */
    .agent-rail {
      width: 80px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      transition: width 200ms cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      height: calc(100vh - 120px);
    }
    .agent-rail.expanded { width: 310px; }
    .agent-rail-header {
      padding: 8px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .agent-rail-toggle {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 4px;
      min-height: 32px;
      transition: all 0.15s ease;
    }
    .agent-rail-toggle:hover {
      background: var(--surface3);
      color: var(--text);
      border-color: var(--border-hover);
    }
    .agent-rail.expanded .agent-rail-toggle { flex-direction: row; gap: 6px; }
    .agent-rail.expanded .toggle-icon { transform: rotate(180deg); }
    .agent-rail-list {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      flex: 1;
    }
    .agent-rail-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 6px;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .agent-rail-card:hover, .agent-rail-card:focus-visible {
      border-color: var(--border-hover);
      background: var(--surface3);
      outline: none;
    }
    .agent-collapsed-identity {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }
    .agent-rail.expanded .agent-collapsed-identity { display: none; }
    .agent-avatar-wrap {
      position: relative;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #090d16;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .agent-pulse-dot {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 2px solid var(--surface);
      background: var(--text-muted);
    }
    .dot-connected { background: var(--green); box-shadow: 0 0 6px rgba(16,185,129,0.6); }
    .dot-disconnected { background: var(--text-muted); }
    .agent-avatar-wrap .model-svg { width: 20px; height: 20px; }

    .model-svg.icon-gemini { color: #60a5fa; }
    .model-svg.icon-codex { color: #34d399; }
    .model-svg.icon-grok { color: #f8fafc; }
    .model-svg.icon-claude { color: #fb923c; }

    .agent-name-collapsed {
      display: block;
      max-width: 64px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    .agent-role-mini {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .workflow-mini-pill {
      font-size: 9.5px;
      font-weight: 600;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 999px;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* --- Rail Expanded Content --- */
    .agent-rail:not(.expanded) .agent-expanded-content { display: none; }
    .agent-expanded-content { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .agent-identity-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .agent-identity-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .agent-full-name {
      display: block;
      font-size: 13px;
      font-weight: 650;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agent-role-full {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .agent-model-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .model-badge-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      color: var(--text);
      font-size: 11px;
      font-weight: 500;
    }
    .model-badge-chip .model-svg { width: 13px; height: 13px; }
    .agent-rail-details {
      border-top: 1px solid var(--border);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .token-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 4px;
    }
    .token-col { text-align: center; }
    .token-col dt { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .token-col dd {
      margin: 2px 0 0;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
    .agent-task-desc {
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.4;
      overflow-wrap: anywhere;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
    }

    /* --- Plan Panel --- */
    .plan-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }
    .plan-title { font-weight: 700; font-size: 15px; color: var(--text); }
    .progress-bar {
      flex: 1; max-width: 220px; height: 6px;
      background: var(--surface2); border-radius: 999px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #06b6d4);
      border-radius: 999px;
      transition: width 0.3s ease;
    }
    .plan-pct {
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .plan-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 6px;
      transition: background 0.12s ease;
    }
    .plan-item:hover { background: var(--surface2); }
    .plan-item.child { padding-left: 32px; font-size: 12.5px; color: var(--text-dim); }
    .plan-num {
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      font-family: monospace;
      min-width: 1.6em;
      font-weight: 600;
    }
    .plan-check {
      font-size: 14px;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }
    .plan-check.done { color: var(--green); }
    .plan-check.progress { color: var(--accent); }
    .plan-check.blocked { color: var(--red); }
    .plan-check.pending { color: var(--text-muted); }
    .plan-assignee {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 1px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .plan-meta { font-size: 11.5px; color: var(--text-muted); }
    .plan-note {
      font-size: 12px;
      color: var(--yellow);
      padding: 8px 14px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* --- Stats Panel --- */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .stat-label { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; }
    .usage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
      gap: 12px;
    }
    .usage-agent { padding: 14px; min-width: 0; }
    .usage-agent h3 { margin: 0 0 4px; font-size: 14px; font-weight: 650; }
    .usage-counters {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 10px 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
    }
    .usage-counters dt { color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
    .usage-counters dd {
      margin: 3px 0 0;
      font-size: 14px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      font-family: ui-monospace, monospace;
    }
    .usage-note { color: var(--text-muted); font-size: 11.5px; line-height: 1.4; }

    /* --- Files & Knowledge --- */
    .table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .table th {
      text-align: left; padding: 8px 12px; color: var(--text-muted);
      font-weight: 600; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.04em; border-bottom: 1px solid var(--border);
    }
    .table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text); }
    .knowledge-item { padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .knowledge-key { font-weight: 600; color: var(--accent); font-size: 13px; }
    .knowledge-cat {
      font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-left: 6px;
      background: var(--purple-soft); color: var(--purple);
      text-transform: uppercase; font-weight: 600;
    }
    .knowledge-value { font-size: 13px; color: var(--text); margin-top: 4px; line-height: 1.5; }
    .knowledge-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

    /* --- Empty state --- */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .empty-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 18px;
    }

    /* --- Session Picker Overlay --- */
    .picker-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      z-index: 100; display: none; align-items: flex-start; justify-content: center;
      padding-top: 80px;
    }
    .picker-overlay.open { display: flex; }
    .picker {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; width: 500px; max-height: 460px;
      display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .picker-search {
      padding: 12px 16px; border: none; border-bottom: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-size: 13.5px;
      outline: none; width: 100%; font-family: inherit;
    }
    .picker-search::placeholder { color: var(--text-muted); }
    .picker-list { overflow-y: auto; flex: 1; padding: 6px; }
    .picker-group { padding: 8px 10px 4px; font-size: 10.5px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .picker-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; cursor: pointer; font-size: 13px;
      border-radius: 6px; background: transparent; border: 1px solid transparent;
      color: var(--text); width: 100%; text-align: left;
      transition: background 0.1s ease;
    }
    .picker-item:hover, .picker-item.focused { background: var(--surface2); border-color: var(--border); }
    .picker-item.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
    .picker-item-name { flex: 1; font-weight: 550; }
    .picker-item-id { font-size: 11px; color: var(--text-muted); font-family: monospace; }
    .picker-item-time { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .picker-empty { padding: 24px; text-align: center; color: var(--text-muted); font-size: 13px; }

    /* --- Utilities --- */
    .flex { display: flex; }
    .gap-2 { gap: 8px; }
    .items-center { align-items: center; }
    .hidden { display: none !important; }

    /* --- Scrollbar --- */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

    /* --- Responsive & Accessibility --- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
    @media (max-width: 1100px) {
      .conversation-room { grid-template-columns: 180px minmax(0, 1fr) auto; }
    }
    @media (max-width: 768px) {
      .conversation-room { grid-template-columns: minmax(0, 1fr); height: auto; }
      .conversation-nav { height: auto; }
      .conversation-sessions-list { max-height: 140px; }
      .agent-rail { width: 100%; height: auto; max-height: none; }
      .agent-rail.expanded { width: 100%; }
      .header { height: auto; padding: 8px 12px; }
      .feed-toolbar { flex-wrap: wrap; }
    }
  </style>
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span class="conn-dot" id="conn-dot"></span>
        <span class="header-title">multiagents</span>
        <button type="button" class="header-session" id="session-name" title="Chọn phiên làm việc">Đang kết nối… &#9662;</button>
      </div>
      <div class="header-right">
        <span id="session-status-badge" class="badge" style="display:none"></span>
        <span id="agent-count"></span>
        <span id="uptime"></span>
        <span id="ws-status" style="font-size:11px"></span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs" id="tab-bar">
      <button type="button" class="tab active" data-tab="messages">Hội thoại <span class="tab-badge" id="badge-messages">0</span></button>
      <button type="button" class="tab" data-tab="plan">Plan <span class="tab-badge" id="badge-plan">-</span></button>
      <button type="button" class="tab" data-tab="knowledge">Knowledge <span class="tab-badge" id="badge-knowledge">0</span></button>
      <button type="button" class="tab" data-tab="files">Files <span class="tab-badge" id="badge-files">0</span></button>
      <button type="button" class="tab" data-tab="stats">Stats <span class="tab-badge" id="badge-stats"></span></button>
      <button class="tab studio-tab" type="button" data-tab="studio" aria-controls="panel-studio">Studio <span class="tab-badge" id="badge-studio">new</span></button>
    </div>

    <!-- Tab panels -->
    <div class="main" id="main">
      <div id="panel-agents" class="hidden"></div>
      <div id="panel-messages"><p role="status">Đang chờ dữ liệu hội thoại…</p></div>
      <div id="panel-plan" class="hidden"></div>
      <div id="panel-knowledge" class="hidden"></div>
      <div id="panel-files" class="hidden"></div>
      <div id="panel-stats" class="hidden"></div>
      <div id="panel-studio" class="hidden" aria-labelledby="studio-title"></div>
    </div>
  </div>

  <!-- Session Picker Overlay -->
  <div class="picker-overlay" id="picker-overlay" role="dialog" aria-modal="true" aria-label="Chọn phiên làm việc">
    <div class="picker">
      <input class="picker-search" id="picker-search" type="text" aria-label="Tìm phiên làm việc" placeholder="Tìm phiên…" autocomplete="off" />
      <div class="picker-list" id="picker-list"></div>
    </div>
  </div>

  <script>
    // =========================================================================
    // multiagents Web Dashboard - Frontend
    // =========================================================================

    let state = null;
    let activeTab = "messages";
    let ws = null;
    let wsAttempt = 0;
    let autoScroll = true;
    let messageAgent = "";
    let messageQuery = "";


    // --- WebSocket ---

    function connectWs() {
      const url = `ws://${location.host}/ws`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        wsAttempt = 0;
        document.getElementById("ws-status").textContent = "Đã kết nối";
        document.getElementById("ws-status").style.color = "#3fb950";
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "state") {
            state = msg.data;
            render();
          }
        } catch {}
      };

      ws.onclose = () => {
        document.getElementById("ws-status").textContent = "Mất kết nối, đang thử lại…";
        document.getElementById("ws-status").style.color = "#d29922";
        const delay = Math.min(500 * Math.pow(2, wsAttempt) + Math.random() * 1000, 30000);
        wsAttempt++;
        setTimeout(connectWs, delay);
      };

      ws.onerror = () => ws.close();


    }

    // --- Tab switching ---

    document.getElementById("tab-bar").addEventListener("click", (e) => {
      const tab = e.target.closest(".tab");
      if (!tab) return;
      activeTab = tab.dataset.tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      showPanel(activeTab);
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.target.closest("input,select,textarea,[contenteditable=true]")) return;
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        openPicker();
        return;
      }
      const tabs = ["agents", "messages", "plan", "knowledge", "files", "stats"];
      const num = parseInt(e.key);
      if (num >= 1 && num <= tabs.length) {
        activeTab = tabs[num - 1];
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelector(`[data-tab="${activeTab}"]`)?.classList.add("active");
        showPanel(activeTab);
      }
    });

    function showPanel(tab) {
      document.querySelectorAll("[id^='panel-']").forEach(p => p.classList.add("hidden"));
      const panel = document.getElementById(`panel-${tab}`);
      if (panel) panel.classList.remove("hidden");
      if (state) render();
    }

    // --- Rendering ---

    function render() {
      if (!state) return;
      renderHeader();
      renderBadges();

      switch (activeTab) {
        case "agents": renderAgents(); break;
        case "messages": renderMessages(); break;
        case "plan": renderPlan(); break;
        case "knowledge": renderKnowledge(); break;
        case "files": renderFiles(); break;
        case "stats": renderStats(); break;
      }
    }

    function isSessionComplete() {
      if (!state || !state.slots.length) return false;
      const allDisconnected = state.slots.every(s => s.status === "disconnected");
      if (!allDisconnected) return false;
      // Terminal: all agents finished their work (approved/released/done_pending_review with no active reviewers)
      const allDone = state.slots.every(s =>
        s.task_state === "approved" || s.task_state === "released"
      );
      return allDone;
    }

    function renderHeader() {
      const dot = document.getElementById("conn-dot");
      const complete = isSessionComplete();
      const sessionStatus = state.session?.status;
      const isArchived = sessionStatus === "archived";
      const isPaused = sessionStatus === "paused";

      // Dot color: green=active, yellow=paused, dim=completed/archived, red=broker down
      if (!state.brokerAlive) {
        dot.className = "conn-dot dead";
        dot.style.background = "";
        dot.style.boxShadow = "";
      } else if (isArchived || complete) {
        dot.className = "conn-dot";
        dot.style.background = "var(--text-muted)";
        dot.style.boxShadow = "none";
      } else if (isPaused) {
        dot.className = "conn-dot";
        dot.style.background = "var(--yellow)";
        dot.style.boxShadow = "0 0 6px var(--yellow)";
      } else {
        dot.className = "conn-dot alive";
        dot.style.background = "";
        dot.style.boxShadow = "";
      }

      const name = document.getElementById("session-name");
      name.textContent = (state.session?.name ?? state.sessionId ?? "Chưa chọn phiên") + " \u25BE";

      // Status badge
      const statusBadge = document.getElementById("session-status-badge");
      if (isArchived) {
        statusBadge.textContent = "Đã lưu trữ";
        statusBadge.className = "badge badge-released";
        statusBadge.style.display = "";
      } else if (isPaused) {
        statusBadge.textContent = "Tạm dừng";
        statusBadge.className = "badge badge-review";
        statusBadge.style.display = "";
      } else if (complete) {
        statusBadge.textContent = "Đã ghi phê duyệt / giải phóng, chưa xác minh bàn giao";
        statusBadge.className = "badge badge-approved";
        statusBadge.style.display = "";
      } else {
        statusBadge.style.display = "none";
      }

      const connected = state.slots.filter(s => s.status === "connected").length;
      document.getElementById("agent-count").textContent = `${connected}/${state.slots.length} worker kết nối`;

      // Timer: show final duration for completed/archived sessions, live for active
      if (state.session?.created_at) {
        let endTime = Date.now();
        if (complete || isArchived) {
          const candidates = [state.session.last_active_at || 0];
          if (state.messages.length) {
            const lastMsg = state.messages[state.messages.length - 1];
            const msgTime = lastMsg.sent_at ? new Date(lastMsg.sent_at).getTime() : 0;
            if (msgTime > 0) candidates.push(msgTime);
          }
          for (const slot of state.slots) {
            if (slot.last_disconnected) candidates.push(slot.last_disconnected);
          }
          endTime = Math.max(...candidates);
          if (endTime <= state.session.created_at) endTime = state.session.created_at;
        }
        const elapsed = Math.round((endTime - state.session.created_at) / 1000);
        const h = Math.floor(elapsed / 3600);
        const m = Math.floor((elapsed % 3600) / 60);
        const s = elapsed % 60;
        let timeStr = "";
        if (h > 0) timeStr = `${h}h ${m}m ${s}s`;
        else if (m > 0) timeStr = `${m}m ${s}s`;
        else timeStr = `${s}s`;
        document.getElementById("uptime").textContent = timeStr;
      } else document.getElementById("uptime").textContent = "";
    }

    function renderBadges() {
      const connected = state.slots.filter(s => s.status === "connected").length;
      document.getElementById("badge-messages").textContent = state.messages.length;
      const planPct = state.plan?.completion;
      const workersOpen = (state.slots || []).some(s => s.task_state !== "released");
      document.getElementById("badge-plan").textContent = planPct != null ? `${planPct >= 100 && workersOpen ? 99 : planPct}%` : "-";
      document.getElementById("badge-knowledge").textContent = state.knowledge?.length ?? 0;
      document.getElementById("badge-files").textContent = state.fileLocks.length + state.fileOwnership.length;

      const warnings = state.guardrails.filter(g => g.status === "warning" || g.status === "triggered").length;
      document.getElementById("badge-stats").textContent = warnings > 0 ? `${warnings}!` : "";
    }


    function connBadge(status) {
      return status === "connected"
        ? '<span class="badge badge-connected">connected</span>'
        : '<span class="badge badge-disconnected">disconnected</span>';
    }

    function taskBadge(state) {
      const map = {
        working: "badge-working",
        done_pending_review: "badge-review",
        addressing_feedback: "badge-feedback",
        approved: "badge-approved",
        released: "badge-released",
        idle: "badge-idle",
      };
      const cls = map[state] || "badge-idle";
      return `<span class="badge ${cls}">${esc(state)}</span>`;
    }

    function renderAgents() {
      const el = document.getElementById("panel-agents");
      if (!el) return;
      if (!state.slots.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">~</div>No agents in session</div>';
        return;
      }
      const peerMap = new Map((state.peers || []).map(p => [p.id, p]));
      const html = state.slots.map(slot => {
        const peer = slot.peer_id ? peerMap.get(slot.peer_id) : null;
        let snapshot = {};
        try { snapshot = JSON.parse(slot.context_snapshot || "{}"); } catch {}
        const assigned = (state.plan?.items || []).filter(i => i.assigned_to_slot === slot.id && i.status !== "done");
        const owned = (state.fileOwnership || []).filter(f => f.slot_id === slot.id);
        const locked = (state.fileLocks || []).filter(f => f.held_by_slot === slot.id);
        const updated = snapshot.updated_at || slot.last_connected;
        const stale = slot.status === "connected" && updated && Date.now() - updated > 60000;
        const reported = state.messages.filter(m => m.from_slot_id === slot.id).sort((a,b) => new Date(b.sent_at) - new Date(a.sent_at))[0];
        const summary = peer?.summary ?? (slot.context_snapshot ? (() => {
          try { return JSON.parse(slot.context_snapshot)?.last_summary; } catch { return null; }
        })() : null);
        const tokens = typeof renderUsage === "function" ? renderUsage(slot) : "";
        const mInfo = modelInfo(slot);
        return `<div class="agent-card">
          <div class="agent-top">
            <div class="agent-title-row">
              <span class="agent-name">${esc(slot.display_name ?? `Slot ${slot.id}`)}</span>
              <span class="badge-engine badge-engine--codex">${mInfo.icon} ${esc(mInfo.brand)}</span>
            </div>
            ${connBadge(slot.status)}
          </div>
          <div class="agent-role">${esc(slot.role ?? slot.agent_type ?? "")}</div>
          <div style="display:flex;gap:8px;align-items:center;margin:4px 0">
            <span>Workflow:</span> ${taskBadge(slot.task_state ?? "idle")}
            <span style="font-size:11px;color:var(--text-muted)">${slot.agent_type}</span>
          </div>
          <div class="agent-activity">
            <dl class="activity-fields">
              <div><dt>Assigned task / active plan</dt><dd>${esc(snapshot.current_task || assigned.map(i => i.label).join("\n") || "No active plan item assigned")}</dd></div>
              <div><dt>Latest observed step</dt><dd>${esc(snapshot.last_summary || summary || "No activity reported")}</dd></div>
              <div><dt>Files (locks / ownership, not proof of edits)</dt><dd>${esc([...locked.map(f => f.file_path), ...owned.map(f => f.path_pattern)].filter(Boolean).join("\n") || "No file activity reported")}</dd></div>
              <div><dt>Last activity</dt><dd>${updated ? esc(new Date(updated).toLocaleString()) : "Not recorded"}${slot.status !== "connected" ? " - worker offline" : ""}</dd></div>
              <div><dt>Test results</dt><dd>Not independently verified. See agent reports in Messages.</dd></div>
              <div><dt>Blockers</dt><dd>${esc(snapshot.blocker || (assigned.some(i => i.status === "blocked") ? "An assigned plan item is blocked. See Messages for details." : "No explicit blocker recorded; this does not confirm successful execution."))}</dd></div>
              <div><dt>Review</dt><dd>${slot.task_state === "approved" ? "Recorded approval - not independent proof of delivery" : slot.task_state === "done_pending_review" ? "Awaiting reviewer" : "No approval for current work"}</dd></div>
            </dl>
            ${stale ? '<div class="activity-warning">Needs inspection: no recent activity. Completion is not confirmed.</div>' : ""}
            <details class="agent-summary"><summary>Latest agent report</summary>${esc(reported?.text || "No report received")}</details>
          </div>
          ${tokens}
          <div class="agent-card-actions">
            <button type="button" class="btn-subtle" onclick="selectAgentFilter('${slot.id}')">Trò chuyện 1-on-1</button>
          </div>
        </div>`;
      }).join("");
      el.innerHTML = `<div class="agents-grid">${html}</div>`;
    }

    // --- Messages panel ---

    function patchTimeline(feed, messages, slotMap) {
      const keep = new Set(messages.map(m => String(m.id)));
      for (const row of [...feed.children]) if (!keep.has(row.dataset.messageId)) row.remove();
      const rows = new Map([...feed.children].map(row => [row.dataset.messageId, row]));
      for (const [index, m] of messages.entries()) {
        const key = String(m.id);
        const fromSlot = slotMap.get(m.from_slot_id);
        const from = fromSlot?.display_name || m.from_id || "Không có ID người gửi";
        const to = slotMap.get(m.to_slot_id)?.display_name || m.to_id || "Nhóm";
        const version = JSON.stringify([m, from, to]);
        let row = rows.get(key);
        if (!row) {
          row = document.createElement("article");
          row.className = "timeline-entry";
          row.dataset.messageId = key;
        }
        if (feed.children[index] !== row) feed.insertBefore(row, feed.children[index] || null);
        if (row?.dataset.version === version) continue;
        const open = row.querySelector("details")?.open;
        const isSteer = m.msg_type === "steer" || (m.text || "").includes("MID-TURN STEER");
        const isSystem = ["system", "control", "team_change"].includes(m.msg_type);
        row.className = "timeline-entry" + (isSteer ? " timeline-entry--steer" : isSystem ? " timeline-entry--system" : "");

        const heading = document.createElement("header"); heading.className = "timeline-heading";
        if (isSteer) {
          const steerBadge = document.createElement("span");

        const sender = document.createElement("span"); sender.className = "timeline-sender"; sender.textContent = from;

        const type = document.createElement("span"); type.className = "badge " + (isSteer ? "steer-status-tag tag-success" : isSystem ? "badge-system" : "badge-idle"); type.textContent = isSteer ? "Injected" : m.msg_type;

        const toolActionRegex = /^(●\s+|\[tool\]\s*|Read\s+|Edit\(|Write\(|Exec\(|Bash\()/i;

    let sidebarSearchQuery = "";

    async function sendDirectMessage() {
      const input = document.getElementById("prompt-input");
      const text = (input?.value || "").trim();
      if (!text) return;
      const statusEl = document.getElementById("prompt-status");
      const sendBtn = document.getElementById("prompt-send-btn");
      const targetSlotId = messageAgent ? Number(messageAgent) : null;

      if (statusEl) {
        statusEl.textContent = "Đang gửi…";
        statusEl.className = "composer-status pending";
      }
      if (sendBtn) sendBtn.disabled = true;

      try {
        const payload = {
          session_id: state?.sessionId,
          to_slot_id: targetSlotId,
          text: text,
          from_id: "operator",
          msg_type: "chat"
        };
        let ok = false;
        let res = await fetch("/api/message/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).catch(() => null);

        if (!res || !res.ok) {
          res = await fetch("/api/message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }).catch(() => null);
        }

        if (!res || !res.ok) {
          res = await fetch("/api/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          }).catch(() => null);
        }

        if (res && res.ok) {
          ok = true;
        } else if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "send_message", data: payload }));
          ok = true;
        }

        if (ok) {
          input.value = "";
          if (statusEl) {
            statusEl.textContent = "Đã gửi!";
            statusEl.className = "composer-status success";
            setTimeout(() => { if (statusEl && statusEl.textContent === "Đã gửi!") statusEl.textContent = ""; }, 2500);
          }
        } else {
          throw new Error("Gửi không thành công");
        }
      } catch (err) {
        if (statusEl) {
          statusEl.textContent = "Lỗi: " + (err.message || "Thử lại");
          statusEl.className = "composer-status error";
        }
      } finally {
        if (sendBtn) sendBtn.disabled = false;
      }
    }

      if (nav && nav.dataset.version !== navKey) {
        nav.replaceChildren(...allSessions.slice(0, 50).map(session => {

      const slotMap = new Map(state.slots.map(slot => [slot.id, slot]));

      const roleMeta = role => {

      } else {

        if (targetName) targetName.textContent = "Hội thoại nhóm";

              <span class="agent-group-dot"></span>
              <span>${g.label}</span>
              <span style="margin-left:auto;font-size:9.5px;color:var(--text-muted)">(${inGroup.length})</span>
            </div>
            ${inGroup.map(slot => {
              const isSel = String(slot.id) === String(messageAgent) ? "selected" : "";
              const mInfo = modelInfo(slot);
              const rInfo = roleMeta(slot.role || slot.agent_type || "Agent");
              const conn = slot.status === "connected";
              const wf = workflowMeta(slot.task_state);
              const lastMsg = state.messages.filter(m => m.from_slot_id === slot.id || m.to_slot_id === slot.id).at(-1);
              const preview = lastMsg ? (lastMsg.text || "").slice(0, 48) : (slot.task_state ? wf.label : "Sẵn sàng");
              const dotCls = !conn ? "dot-disconnected" : g.dot;
              const connLabel = conn ? "Kết nối" : "Ngắt kết nối";
              return `<div class="agent-nav-card ${isSel}" data-slot="${slot.id}" tabindex="0" role="button" aria-label="${esc(slot.display_name)} - ${esc(rInfo.full)} - ${connLabel}">
                <div class="agent-avatar-circle" title="${esc(mInfo.brand)}">
                  <span>${esc(rInfo.mini)}</span>
                  <span class="agent-pulse-dot ${dotCls}"></span>
                </div>
                <div class="agent-nav-card-info">
                  <div class="agent-nav-card-top">
                    <strong class="agent-nav-card-name">${esc(slot.display_name || "Worker " + slot.id)}</strong>
                    <span class="agent-nav-card-runtime" title="Model: ${esc(mInfo.brand)}">${esc(mInfo.brand)}</span>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <span class="agent-nav-card-role">${esc(rInfo.full)}</span>
                    <span class="badge ${wf.cls}" style="font-size:9.5px;padding:1px 5px">${esc(wf.label)}</span>
                    <span class="status-label-text" style="font-size:9.5px;color:${conn ? "var(--green)" : "var(--text-muted)"}">[${connLabel}]</span>
                  </div>
                  <span class="agent-nav-card-preview">${esc(preview)}</span>
                </div>
              </div>`;
            }).join("")}
          </div>`;
        }

        info.innerHTML = sidebarHtml;
        info.dataset.version = infoKey;

        // Card click handler
        info.querySelectorAll(".agent-nav-card").forEach(card => {
          card.onclick = () => {
            messageAgent = card.dataset.slot || "";
            const sel = el.querySelector("#message-agent");
            if (sel) sel.value = messageAgent;
            renderMessages(true);
          };
        });
      }
    }
    // --- Plan panel ---

    function planStatusLabel(status) {
      return { done: "xong", in_progress: "đang làm", blocked: "bị chặn", pending: "chưa làm" }[status] || status;
    }

    function renderPlan() {
      const el = document.getElementById("panel-plan");
      if (!state.plan?.plan) {
        el.innerHTML = '<div class="empty"><div class="empty-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><span>Chưa có kế hoạch</span></div>';
        return;
      }
      const { plan, items } = state.plan;
      const workersOpen = (state.slots || []).some(s => s.task_state !== "released");
      const completion = state.plan.completion >= 100 && workersOpen ? 99 : state.plan.completion;
      const slotMap = new Map(state.slots.map(s => [s.id, s]));
      const statusIcon = { done: '<span class="plan-check done">&#10003;</span>',
        in_progress: '<span class="plan-check progress">&#9654;</span>',
        blocked: '<span class="plan-check blocked">&#10007;</span>',
        pending: '<span class="plan-check pending">&#9675;</span>' };
      const roots = items.filter(item => !item.parent_id);
      const byParent = new Map();
      for (const item of items) {
        if (!item.parent_id) continue;
        const list = byParent.get(item.parent_id) || [];
        list.push(item);
        byParent.set(item.parent_id, list);
      }
      let taskNo = 0;
      const renderItem = (item, child) => {
        const icon = statusIcon[item.status] ?? statusIcon.pending;
        const assignee = item.assigned_to_slot ? slotMap.get(item.assigned_to_slot)?.display_name : item.assigned_name;
        const num = child ? "" : `<span class="plan-num">${++taskNo}.</span>`;
        const dimClass = item.status === "done" ? 'style="opacity:0.55"' : "";
        return `<div class="plan-item${child ? " child" : ""}" ${dimClass}>
          ${num}${icon}
          <span>${esc(item.label)} <span class="plan-meta">· ${esc(planStatusLabel(item.status))}</span></span>
          ${assignee ? `<span class="plan-assignee">${esc(assignee)}</span>` : ""}
        </div>`;
      };
      const itemsHtml = (roots.length ? roots : items).map(item => {
        const kids = byParent.get(item.id) || [];
        return renderItem(item, false) + kids.map(kid => renderItem(kid, true)).join("");
      }).join("");
      const done = items.filter(i => i.status === "done").length;
      const inProgress = items.filter(i => i.status === "in_progress").length;
      const openWorkers = (state.slots || []).filter(s => s.task_state !== "released").length;
      const taskVi = { released: "đã đóng", approved: "QC xong, chưa đóng", done_pending_review: "chờ QC", addressing_feedback: "sửa sau QC", working: "đang làm", idle: "sẵn sàng" };
      const qcHtml = (state.slots || []).map(s =>
        `<div class="plan-item child">
          <span class="plan-check ${s.task_state === "released" ? "done" : "pending"}">${s.task_state === "released" ? "&#10003;" : "&#9675;"}</span>
          <span>QC / đóng ${esc(s.display_name || "worker")} <span class="plan-meta">· ${esc(taskVi[s.task_state] || s.task_state)}</span></span>
        </div>`
      ).join("");
      const note = openWorkers > 0
        ? `<div class="plan-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> ${openWorkers} worker chưa đóng. Item tick hết vẫn chưa 100%.</div>`
        : "";

      el.innerHTML = `<div class="card">
        <div class="card-header">
          <div class="plan-header">
            <span class="plan-title">${esc(plan.title)}</span>
            <div class="progress-bar"><div class="progress-fill" style="width:${completion}%"></div></div>
            <span class="plan-pct">${completion}%</span>
          </div>
          <span class="plan-meta">${done}/${items.length} xong${inProgress ? ` · ${inProgress} đang xử lý` : ""}</span>
        </div>
        <div style="padding:10px 12px">${itemsHtml}${qcHtml}</div>
        ${note}
      </div>`;
    }

    // --- Knowledge panel ---

    function renderKnowledge() {
      const el = document.getElementById("panel-knowledge");
      const entries = state.knowledge ?? [];
      if (!entries.length) {
        el.innerHTML = '<div class="empty"><div class="empty-icon">~</div>No knowledge entries. Agents will store decisions and discoveries here.</div>';
        return;
      }
      const html = entries.map(e => {
        const by = e.created_by_name ? `by ${esc(e.created_by_name)}` : "";
        const ago = timeSince(e.updated_at);
        return `<div class="knowledge-item">
          <div><span class="knowledge-key">${esc(e.key)}</span><span class="knowledge-cat">${esc(e.category)}</span></div>
          <div class="knowledge-value">${esc(e.value)}</div>
          <div class="knowledge-meta">${by}${by && ago ? " \u00b7 " : ""}${ago}</div>
        </div>`;
      }).join("");
      el.innerHTML = `<div class="card"><div class="card-header">Shared Knowledge <span style="font-size:12px;color:var(--text-dim)">(${entries.length})</span></div>${html}</div>`;
    }

    // --- Files panel ---

    function renderFiles() {
      const el = document.getElementById("panel-files");
      const slotMap = new Map(state.slots.map(s => [s.id, s]));
      let html = "";

      if (state.fileOwnership.length) {
        const rows = state.fileOwnership.map(o => {
          const owner = slotMap.get(o.slot_id)?.display_name ?? `Slot ${o.slot_id}`;
          return `<tr><td>${esc(o.path_pattern)}</td><td>${esc(owner)}</td><td style="color:var(--text-dim)">${esc(o.assigned_by ?? "")}</td></tr>`;
        }).join("");
        html += `<div class="card"><div class="card-header">Ownership Zones</div>
          <table class="table"><thead><tr><th>Pattern</th><th>Owner</th><th>Assigned By</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }

      if (state.fileLocks.length) {
        const rows = state.fileLocks.map(l => {
          const holder = slotMap.get(l.held_by_slot)?.display_name ?? `Slot ${l.held_by_slot}`;
          return `<tr><td>${esc(l.file_path)}</td><td>${esc(holder)}</td><td>${l.lock_type}</td></tr>`;
        }).join("");
        html += `<div class="card"><div class="card-header">Active Locks</div>
          <table class="table"><thead><tr><th>File</th><th>Held By</th><th>Type</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      }

      if (!html) {
        html = '<div class="empty"><div class="empty-icon">~</div>No file locks or ownership zones</div>';
      }
      el.innerHTML = html;
    }

    // --- Stats panel ---

    function usageData(slot) {
      try { return JSON.parse(slot.agent_usage || "null"); } catch { return null; }
    }
    function observedTokens(slot) {
      return Boolean(usageData(slot)?.tokensObservedAt);
    }
    function tokenText(slot, field) {
      if (!observedTokens(slot) || !Number.isSafeInteger(slot[field]) || slot[field] < 0) return "Chưa được báo cáo";
      return slot[field].toLocaleString("en-US");
    }
    function renderUsage(slot) {
      const data = usageData(slot);
      return `<section aria-label="Token đã ghi nhận">
        <dl class="usage-counters"><div><dt>Input</dt><dd>${tokenText(slot, "input_tokens")}</dd></div><div><dt>Cached input</dt><dd>${tokenText(slot, "cache_read_tokens")}</dd></div><div><dt>Output</dt><dd>${tokenText(slot, "output_tokens")}</dd></div></dl>
        <div class="usage-note">${data?.tokensObservedAt ? `Tổng đã ghi nhận; cached đã nằm trong input. Cập nhật ${esc(new Date(data.tokensObservedAt).toLocaleString())}.` : "Chưa nhận báo cáo token được hỗ trợ. Không phải số 0 đo được."}</div>
      </section>`;
    }

    function renderStats() {
      const el = document.getElementById("panel-stats");

      // Session metrics
      const connected = state.slots.filter(s => s.status === "connected").length;
      const working = state.slots.filter(s => s.task_state === "working").length;
      const approved = state.slots.filter(s => s.task_state === "approved" || s.task_state === "released").length;
      const measured = state.slots.filter(observedTokens);
      const total = field => measured.length ? fmtTokens(measured.reduce((a, s) => a + (s[field] ?? 0), 0)) : "Not reported";

      const statsCards = [
        { value: connected, label: "Connected Agents", color: "var(--green)" },
        { value: working, label: "Working", color: "var(--blue)" },
        { value: approved, label: "Approved", color: "var(--green)" },
        { value: state.messages.length, label: "Messages", color: "var(--cyan)" },
        { value: total("input_tokens"), label: "Observed Input Tokens", color: "var(--cyan)" },
        { value: total("cache_read_tokens"), label: "Observed Cached Input", color: "var(--cyan)" },
        { value: total("output_tokens"), label: "Observed Output Tokens", color: "var(--cyan)" },
      ];

      const cardsHtml = statsCards.map(s =>
        `<div class="stat-card"><div class="stat-value" style="color:${s.color}">${s.value}</div><div class="stat-label">${s.label}</div></div>`
      ).join("");

      // Guardrails
      let guardrailHtml = "";
      const enforced = state.guardrails.filter(g => g.action !== "monitor");
      if (enforced.length) {
        guardrailHtml = `<div class="card" style="margin-top:16px"><div class="card-header">Guardrails</div>
          <div style="padding:12px 14px">${enforced.map(g => {
            const pct = g.current_value && g.default_value ? Math.min(100, Math.round((g.current_value / g.default_value) * 100)) : 0;
            const color = g.status === "triggered" ? "var(--red)" : g.status === "warning" ? "var(--yellow)" : "var(--green)";
            return `<div style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(g.label)}</span><span style="color:${color}">${g.current_value}/${g.default_value} ${g.unit ?? ""}</span></div>
              <div class="progress-bar" style="margin-top:4px"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
            </div>`;
          }).join("")}</div></div>`;
      }

      const agentUsage = state.slots.map(slot => `<article class="card usage-agent"><h3>${esc(slot.display_name || `Slot ${slot.id}`)}</h3><div class="usage-note">${esc(slot.model_selection?.provider || slot.agent_type)} / ${esc(slot.model_selection?.model || "default model")}</div>${renderUsage(slot)}</article>`).join("");
      el.innerHTML = `<div class="stats-grid">${cardsHtml}</div><p class="usage-note">Token coverage: ${measured.length}/${state.slots.length} agents. Totals may be partial; no billing estimate. Input includes cached input.</p><div class="usage-grid">${agentUsage}</div>${guardrailHtml}`;
    }

    // --- Helpers ---

    function esc(s) { if (!s) return ""; const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function truncate(s, n) { return s && s.length > n ? s.slice(0, n) + "..." : s; }
    function fmtTokens(n) {
      if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(1)}M`;
      if (n >= 1_000) return `${(n / 1_000).toFixed(1)}k`;
      return String(n);
    }
    function modelInfo(slot) {
      const raw = String(slot?.model_selection?.model || slot?.agent_type || slot?.display_name || "").toLowerCase();
      const label = slot?.model_selection?.model || slot?.agent_type || "AI";
      const gemini = '<svg class="model-svg icon-gemini" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C12 7.523 7.523 12 2 12C7.523 12 12 16.477 12 22C12 16.477 16.477 12 22 12C16.477 12 12 7.523 12 2Z"/></svg>';
      const openai = '<svg class="model-svg icon-codex" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12"/><path d="M12 6a6 6 0 1 1-6 6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>';
      const grok = '<svg class="model-svg icon-grok" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="4" x2="20" y2="20"/><line x1="15" y1="4" x2="20" y2="9"/><line x1="4" y1="15" x2="9" y2="20"/></svg>';
      const claude = '<svg class="model-svg icon-claude" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="12,2 15,9 22,12 15,15 12,22 9,15 2,12 9,9"/></svg>';
      const fallback = '<svg class="model-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
      if (raw.includes("gemini") || raw.startsWith("ag/") || raw.includes("google")) return { brand: "Gemini", icon: gemini, label };
      if (raw.includes("grok") || raw.includes("xai")) return { brand: "Grok", icon: grok, label };
      if (raw.includes("claude") || raw.includes("anthropic")) return { brand: "Claude", icon: claude, label };
      if (raw.includes("codex") || raw.includes("openai") || raw.includes("gpt") || raw.startsWith("cx/") || raw === "codex") return { brand: "OpenAI / Codex", icon: openai, label };
      return { brand: "AI", icon: fallback, label };
    }
    function fmtTime(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleTimeString("en-US", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
      } catch { return ""; }
    }
    function timeSince(epoch) {
      if (!epoch) return "";
      const s = Math.round((Date.now() - epoch) / 1000);
      if (s < 60) return `${s}s ago`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      return `${h}h ago`;
    }

    // --- Session Picker ---

    let allSessions = [];
    let pickerFocusIdx = 0;
    let pickerFiltered = [];

    function openPicker() {
      const overlay = document.getElementById("picker-overlay");
      const search = document.getElementById("picker-search");
      overlay.classList.add("open");
      search.value = "";
      search.focus();
      fetchSessions();
    }

    function closePicker() {
      const overlay=document.getElementById("picker-overlay");
      if (!overlay.classList.contains("open")) return;
      overlay.classList.remove("open");
      document.getElementById("session-name").focus();
    }

    async function fetchSessions() {
      try {
        const res = await fetch("/api/sessions");
        if (!res.ok) throw new Error("Không tải được danh sách phiên.");
        allSessions = await res.json();
        // Sort: active first, then paused, then archived; within each group by most recent
        allSessions.sort((a, b) => {
          const order = { active: 0, paused: 1, archived: 2 };
          const so = (order[a.status] ?? 3) - (order[b.status] ?? 3);
          if (so !== 0) return so;
          return (b.last_active_at ?? b.created_at ?? 0) - (a.last_active_at ?? a.created_at ?? 0);
        });
        renderPicker();
        if(activeTab==="messages" && state) renderMessages();
      } catch { allSessions = []; document.getElementById("picker-list").textContent="Không tải được phiên. Kiểm tra kết nối rồi thử lại."; }
    }

    function renderPicker() {
      const search = document.getElementById("picker-search").value.toLowerCase();
      pickerFiltered = allSessions.filter(s =>
        !search || s.name?.toLowerCase().includes(search) || s.id.toLowerCase().includes(search)
      );
      pickerFocusIdx = Math.min(pickerFocusIdx, Math.max(0, pickerFiltered.length - 1));

      const list = document.getElementById("picker-list");
      if (!pickerFiltered.length) {
        list.innerHTML = '<div class="picker-empty">Không tìm thấy phiên</div>';
        return;
      }

      let html = "";
      let lastStatus = "";
      pickerFiltered.forEach((s, i) => {
        if (s.status !== lastStatus) {
          lastStatus = s.status;
          const label = s.status === "active" ? "Đang hoạt động" : s.status === "paused" ? "Tạm dừng" : "Đã lưu trữ";
          html += `<div class="picker-group">${label}</div>`;
        }
        const isCurrent = state?.sessionId === s.id;
        const focused = i === pickerFocusIdx ? " focused" : "";
        const active = isCurrent ? " active" : "";
        const age = timeSince(s.last_active_at ?? s.created_at);
        const statusDot = s.status === "active"
          ? '<span style="color:var(--green)">&#9679;</span>'
          : s.status === "paused"
            ? '<span style="color:var(--yellow)">&#9679;</span>'
            : '<span style="color:var(--text-muted)">&#9679;</span>';
        html += `<button type="button" class="picker-item${focused}${active}" data-idx="${i}" data-id="${esc(s.id)}">
          ${statusDot}
          <span class="picker-item-name">${esc(s.name || s.id)}</span>
          <span class="picker-item-id">${esc(s.id.length > 24 ? s.id.slice(0, 24) + "..." : s.id)}</span>
          <span class="picker-item-time">${age}</span>
        </button>`;
      });
      list.innerHTML = html;

      // Scroll focused into view
      const focusedEl = list.querySelector(".focused");
      if (focusedEl) focusedEl.scrollIntoView({ block: "nearest" });
    }

    async function selectSession(id) {
      const error = document.getElementById("conversation-error");
      if(error) error.textContent="";
      try {
        const response = await fetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: id }),
        });
        if(!response.ok) throw new Error("Không đổi được phiên.");
        closePicker();
      } catch { const message="Không đổi được phiên. Hãy thử lại; phiên hiện tại được giữ nguyên."; document.getElementById("picker-list").textContent=message; if(error) error.textContent=message; }
    }

    // Click session name to open picker
    document.getElementById("session-name").addEventListener("click", openPicker);

    // Close on overlay click (not picker body)
    document.getElementById("picker-overlay").addEventListener("click", (e) => {
      if (e.target.id === "picker-overlay") closePicker();
    });

    // Search input
    document.getElementById("picker-search").addEventListener("input", () => {
      pickerFocusIdx = 0;
      renderPicker();
    });

    // Click on picker item
    document.getElementById("picker-list").addEventListener("click", (e) => {
      const item = e.target.closest(".picker-item");
      if (item) selectSession(item.dataset.id);
    });

    // Keyboard navigation in picker
    document.getElementById("picker-search").addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closePicker(); e.preventDefault(); return; }
      if (e.key === "ArrowDown") { pickerFocusIdx = Math.min(pickerFocusIdx + 1, pickerFiltered.length - 1); renderPicker(); e.preventDefault(); return; }
      if (e.key === "ArrowUp") { pickerFocusIdx = Math.max(pickerFocusIdx - 1, 0); renderPicker(); e.preventDefault(); return; }
      if (e.key === "Enter" && pickerFiltered[pickerFocusIdx]) { selectSession(pickerFiltered[pickerFocusIdx].id); e.preventDefault(); return; }
    });

    // Global Escape to close picker
    document.addEventListener("keydown", (e) => {
      const overlay=document.getElementById("picker-overlay");
      if(!overlay.classList.contains("open")) return;
      if (e.key === "Escape") closePicker();
      if(e.key==="Tab") { const items=[...overlay.querySelectorAll("input,button")]; const first=items[0],last=items.at(-1); if(e.shiftKey && document.activeElement===first) { e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement===last) { e.preventDefault(); first.focus(); } }
    });

    // --- Boot ---
    setInterval(() => { if (ws?.readyState === 1) ws.send("ping"); }, 30000);
    connectWs();
  </script>
  <script src="./app.js"></script>
</body>
</html>
